<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Dark Street -->
  <rect width="800" height="600" fill="#222" />
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333" stroke-width="1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Colorful Festive Pandals (Obstacles) -->
  <rect x="150" y="100" width="80" height="80" fill="#ff00ff" opacity="0.8" />
  <rect x="500" y="300" width="100" height="100" fill="#00ff00" opacity="0.8" />
  <rect x="200" y="450" width="120" height="60" fill="#ffff00" opacity="0.8" />
  <rect x="600" y="50" width="60" height="60" fill="#0000ff" opacity="0.8" />

  <!-- The Vehicle (Red Car) -->
  <rect x="380" y="280" width="40" height="20" fill="#ff0000" />
  <rect x="385" y="275" width="10" height="5" fill="#555" />
  <rect x="405" y="275" width="10" height="5" fill="#555" />

  <!-- UI Overlay Mockup -->
  <text x="20" y="40" font-family="sans-serif" font-size="24" fill="white">SCORE: 1250</text>
  <text x="20" y="70" font-family="sans-serif" font-size="18" fill="#ffcc00">LAP: 1</text>
  
  <!-- Title -->
  <text x="400" y="550" font-family="sans-serif" font-size="40" fill="#ffcc00" text-anchor="middle" font-weight="bold">PANDAL DASH</text>
</svg>
